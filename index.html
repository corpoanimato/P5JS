<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bote lowpoly wire frame</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
    function setup() {
      createCanvas(windowWidth, windowHeight, WEBGL);
    }

    function draw() {
      background(17);

      rotateY(frameCount * 0.01);
      rotateX(-0.15);
    // color/grosor de linea y relleno
      stroke(180, 255, 0);
      strokeWeight(3);
      noFill();

      // tapa
      push();
      translate(0, -70, 0);
      drawSimpleCylinder(80, 28, 14);
      pop();

      // cuerpo
      push();
      translate(0, 10, 0);
      drawSimpleCylinder(70, 130, 14);
      pop();

      //etiqueta
      push();
      translate(0, 10, 71);
      stroke(255, 250, 255);
      strokeWeight(1.8);
      rectMode(CENTER);
      rect(0, 0, 85, 60, 8);
      pop();
    }

    function drawSimpleCylinder(r, h, sides) {
      // contornos superior e inferior
      beginShape();
      for (let i = 0; i <= sides; i++) {
        let a = map(i, 0, sides, 0, TWO_PI);
        vertex(cos(a) * r, -h/2, sin(a) * r);
      }
      endShape();

      beginShape();
      for (let i = 0; i <= sides; i++) {
        let a = map(i, 0, sides, 0, TWO_PI);
        vertex(cos(a) * r, h/2, sin(a) * r);
      }
      endShape();

      //íneas verticales para sugerir volumen
      for (let i = 0; i < 6; i++) {
  let a = map(i, 0, 6, 0, TWO_PI);
  beginShape();
  vertex(cos(a) * r, -h/2, sin(a) * r);
  vertex(cos(a) * r, h/2, sin(a) * r);
  endShape();
}
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
